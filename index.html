<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
    background-image: url(https://media.istockphoto.com/id/1474907309/photo/badminton-court-on-3d-illustration.jpg?s=612x612&w=0&k=20&c=YsqiUVVpBnzvla9ksmzrMZ6TF1fk3DXchSRPhpUttqQ=);
    background-size: cover;
    }

    .title{
    display: flex;
    background-color: white;
    width: 100%;
    max-width: 900px;
    padding: 10px;
    text-align: center;
    justify-content: center;
    border-radius: 12px;
    margin: 0 auto 30px auto;
    }

    .title h1{
    color: black;
    font-family: 'Georgia';
    font-weight: bold;
    }

    .col{
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 900px;
    height: auto;
    background-color: rgb(255, 255, 255);
    box-shadow: 0px 3px 10px rgb(0, 0, 0);
    padding: 50px;
    font-size: large;
    }

    .row {
    display: flex;
    flex-direction: row;
    column-gap: 20px;
    }

    #image{
    height: 40%;
    display: block;
    width: 40%;
    margin: 0 auto 30px auto;
    justify-content: center;
    border-radius: 20%;
    border-color: blanchedalmond;
    }


</style>

</head>
<body>
    <br>
    <div class="container">

        <div class="title">
            <h1>🏸 Beginner's Guide on Badminton</h1>
        </div>

        <br>

        <img src="https://cdn.britannica.com/44/256944-050-8D414329/PV-Sindhu-2020-Tokyo-Olympics.jpg" id="image" alt="badminton">

        <br>

        <div class="row">
            <div class="col">
                first div
            </div>

            <div class="col">
                second div
            </div>

            <div class="col">
                third div
            </div>

        </div>
    </div>
</body>
</html>
